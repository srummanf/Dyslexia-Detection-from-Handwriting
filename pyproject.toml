[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dyslexia-detection"
version = "2.0.0"
description = "Screening for dyslexia-related handwriting patterns from handwriting samples."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Shaikh Rumman Fardeen" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "joblib>=1.3",
    "pillow>=10.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
app = [
    "streamlit>=1.49",
    "plotly>=5.20",
    "matplotlib>=3.8",
]
nlp = [
    "pyspellchecker>=0.8",
    "jellyfish>=1.0",
]
ocr = [
    "easyocr>=1.7",
]
vision = [
    "torch>=2.2",
    "timm>=1.0",
    "ultralytics>=8.2",
]
explain = [
    "shap>=0.45",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "jupyter>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# The broad `except Exception` blocks are deliberate: every optional model /
# dependency must degrade to a disabled feature, never crash the app.
ignore = ["BLE001", "DTZ005", "RUF007"]

[tool.pytest.ini_options]
testpaths = ["tests"]
